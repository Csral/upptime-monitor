# Change these first
owner: Csral # Your GitHub organization or username, where this repository lives
repo: upptime-monitor # The name of this repository

sites:
  - name: Csral
    url: https://csral.dev
  - name: Archive of now page
    url: https://records-now.csral.dev

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.csral.dev
  # baseUrl: /your-repo-name
  # logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Uptime Status
  introTitle: "Uptime status for my site. Provided via Upptime."
  introMessage: Uptime checks run automatically and provide status history such as status, and average response time. No Server.
  navbar:
    - title: Status
      href: /
    - title: Home
      href: https://csral.dev
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

